<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Product Links & Budget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

    <header class="bg-white border-b sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">🛍️ Product Wishlist</h1>
                <p class="text-gray-500">Managed via Google Sheets</p>
            </div>
            <div class="bg-blue-50 border border-blue-200 rounded-2xl px-6 py-3 text-center">
                <span class="text-sm font-medium text-blue-600 uppercase tracking-wider block">Total Budget Needed</span>
                <span id="total-budget" class="text-3xl font-bold text-blue-700">$0.00</span>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8">
        <div id="filters" class="flex flex-wrap gap-2 mb-8">
            <button onclick="filterProducts('All')" class="filter-btn px-4 py-2 rounded-full bg-blue-600 text-white text-sm font-medium transition-colors" data-category="All">All</button>
        </div>

        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="animate-pulse bg-white border rounded-2xl p-4 h-48"></div>
            <div class="animate-pulse bg-white border rounded-2xl p-4 h-48"></div>
            <div class="animate-pulse bg-white border rounded-2xl p-4 h-48"></div>
        </div>
    </main>

    <script>
        // YOUR MAGIC LINK
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSjeoofiGRXQhjk9lCUAL7zx2gck_LWVTAXT6RXHMfzobV9lEpLM_wYW6Ph7ATzarFt9muEdmtEmvJP/pub?gid=0&single=true&output=csv';

        let allProducts = [];

        async function loadProducts() {
            try {
                // ADDING A CACHE-BUSTER: This forces the browser to get the latest data every time
                const cacheBuster = '&t=' + new Date().getTime();
                const response = await fetch(SHEET_URL + cacheBuster);
                const csvText = await response.text();
                
                const lines = csvText.split('\n').filter(line => line.trim() !== '');
                const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
                
                allProducts = lines.slice(1).map(line => {
                    const values = line.split(',');
                    const product = {};
                    headers.forEach((header, index) => {
                        product[header] = values[index]?.trim() || '';
                    });
                    product.price = parseFloat(product.price.replace(/[^0-9.-]+/g,"")) || 0;
                    return product;
                });

                setupFilters();
                renderProducts(allProducts);
                updateBudget(allProducts);
            } catch (error) {
                console.error('Error loading spreadsheet:', error);
                document.getElementById('product-grid').innerHTML = '<p class="text-red-500 col-span-full text-center">Error loading spreadsheet. Check your link!</p>';
            }
        }

        function updateBudget(products) {
            const total = products.reduce((sum, p) => sum + p.price, 0);
            document.getElementById('total-budget').innerText = new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD'
            }).format(total);
        }

        function setupFilters() {
            const categories = ['All', ...new Set(allProducts.map(p => p.category))];
            const filterContainer = document.getElementById('filters');
            filterContainer.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.innerText = cat;
                btn.className = `filter-btn px-4 py-2 rounded-full text-sm font-medium transition-colors ${cat === 'All' ? 'bg-blue-600 text-white' : 'bg-white text-gray-600 border hover:bg-gray-100'}`;
                btn.dataset.category = cat;
                btn.onclick = () => filterProducts(cat);
                filterContainer.appendChild(btn);
            });
        }

        function filterProducts(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.category === category) {
                    btn.className = 'filter-btn px-4 py-2 rounded-full bg-blue-600 text-white text-sm font-medium transition-colors';
                } else {
                    btn.className = 'filter-btn px-4 py-2 rounded-full bg-white text-gray-600 border hover:bg-gray-100 text-sm font-medium transition-colors';
                }
            });
            const filtered = category === 'All' ? allProducts : allProducts.filter(p => p.category === category);
            renderProducts(filtered);
        }

        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            if (products.length === 0) {
                grid.innerHTML = '<p class="text-gray-500 col-span-full text-center py-12">No products found in this category.</p>';
                return;
            }
            products.forEach(p => {
                const card = document.createElement('div');
                card.className = 'bg-white border rounded-2xl p-5 shadow-sm hover:shadow-md transition-shadow flex flex-col justify-between group';
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-3">
                            <span class="px-2 py-1 bg-gray-100 text-gray-600 text-xs font-bold rounded uppercase tracking-wider">${p.category}</span>
                            <span class="text-lg font-bold text-blue-600">${new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(p.price)}</span>
                        </div>
                        <h3 class="text-xl font-semibold text-gray-800 mb-2 group-hover:text-blue-600 transition-colors">${p.name}</h3>
                        <p class="text-gray-500 text-sm mb-6 line-clamp-2">${p.description}</p>
                    </div>
                    <a href="${p.link}" target="_blank" class="block w-full text-center bg-gray-900 text-white py-3 rounded-xl font-medium hover:bg-blue-600 transition-colors flex items-center justify-center gap-2">
                        View Product <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                    </a>
                `;
                grid.appendChild(card);
            });
        }
        loadProducts();
    </script>
</body>
</html>
